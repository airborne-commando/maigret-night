<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackbird Web Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/blackbird-theme.css') }}">
</head>

<body>
    <div class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo-container">
                    <div style="font-size: 2rem; margin-right: 10px;">🦅</div>
                    <div>
                        <h1 class="blackbird-title mb-0">Blackbird Web Interface</h1>
                        <small class="text-muted">Advanced OSINT Tool</small>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-light" onclick="window.location.href='{{ url_for('index') }}'">
                        <i class="fas fa-home"></i> Home
                    </button>
                    <button class="btn btn-outline-light" id="theme-toggle">
                        <i class="fas fa-moon"></i> Theme
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p class="mb-0">
                Powered by <a href="https://github.com/p1ngul1n0/blackbird" target="_blank">Blackbird</a> |
                OSINT Tool by <a href="https://github.com/p1ngul1n0" target="_blank">p1ngul1n0</a> |
                Data from <a href="https://github.com/WebBreacher/WhatsMyName" target="_blank">WhatsMyName</a>
            </p>
            <p class="mt-1 mb-0 text-muted">
                <small>
                    <i class="fas fa-shield-alt"></i> Use responsibly and ethically.
                    <i class="fas fa-exclamation-triangle"></i> Respect privacy and terms of service.
                </small>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('theme-toggle').addEventListener('click', function () {
            const html = document.documentElement;
            const icon = this.querySelector('i');
            
            if (html.getAttribute('data-bs-theme') === 'dark') {
                html.setAttribute('data-bs-theme', 'light');
                icon.className = 'fas fa-sun';
                this.classList.replace('btn-outline-light', 'btn-outline-dark');
            } else {
                html.setAttribute('data-bs-theme', 'dark');
                icon.className = 'fas fa-moon';
                this.classList.replace('btn-outline-dark', 'btn-outline-light');
            }
        });
    </script>
</body>

</html>
